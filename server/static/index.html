<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频走查</title>
  <style>
    :root { color-scheme: light; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #172126; background: #eef2f3; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { display: flex; justify-content: space-between; align-items: end; padding: 20px 24px; color: white; background: #153f4a; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    header span { color: #cfe1e4; font-size: 13px; }
    main { padding: 18px 20px 28px; }
    .toolbar { display: grid; grid-template-columns: 1.4fr repeat(6, minmax(130px, 1fr)) auto; gap: 10px; align-items: end; margin-bottom: 14px; }
    label { display: grid; gap: 5px; color: #56666c; font-size: 12px; }
    input, select, textarea, button { min-height: 36px; border: 1px solid #b8c5c9; background: white; font: inherit; }
    input, select, textarea { width: 100%; padding: 7px 9px; }
    button { padding: 7px 12px; color: #153f4a; cursor: pointer; font-weight: 600; }
    button:disabled { cursor: wait; opacity: .55; }
    .table-wrap { overflow: auto; background: white; border: 1px solid #d5dee0; }
    table { width: 100%; min-width: 1680px; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #dce3e5; text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; z-index: 1; color: #33474e; background: #e4ecee; white-space: nowrap; }
    td { font-size: 14px; }
    .name { min-width: 220px; font-weight: 600; }
    .meta { white-space: nowrap; color: #53666d; }
    .shots { display: flex; gap: 8px; min-width: 320px; }
    .shots img { width: 144px; height: 81px; object-fit: contain; background: #152126; cursor: zoom-in; }
    textarea { min-width: 170px; min-height: 82px; resize: vertical; }
    .review { min-width: 130px; }
    .review select { font-weight: 600; transition: background-color .15s, border-color .15s; }
    .rating-unrated { color: #46575d; border-color: #aebbc0; background: #edf1f2; }
    .rating-excellent { color: #155b38; border-color: #70b78f; background: #d9f2e3; }
    .rating-good { color: #155477; border-color: #75afd0; background: #dceef8; }
    .rating-pass { color: #725500; border-color: #d4b950; background: #fff1b8; }
    .rating-fail { color: #8a2730; border-color: #d98990; background: #f9dadd; }
    .status { display: block; min-height: 18px; margin-top: 4px; color: #597078; font-size: 12px; }
    .pager { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 12px; }
    a { color: #086b7d; }
    dialog { width: min(1920px, calc(100vw - 16px)); max-width: none; max-height: calc(100vh - 12px); padding: 0; border: 0; background: #101719; color: white; }
    dialog::backdrop { background: rgb(0 0 0 / 82%); }
    .showcase { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; min-height: min(930px, calc(100vh - 280px)); background: #080d0f; }
    .showcase img { display: block; width: 100%; height: min(930px, calc(100vh - 280px)); object-fit: contain; }
    .showcase-nav, .close { min-height: 44px; border: 0; color: white; background: rgb(0 0 0 / 60%); font-size: 28px; }
    .close { position: absolute; top: 8px; right: 8px; z-index: 2; width: 40px; font-size: 22px; }
    .showcase-info { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; color: #d3e0e2; font-size: 13px; }
    .showcase-actions { display: flex; gap: 6px; }
    .showcase-actions button { min-height: 30px; border: 1px solid #60777e; color: white; background: transparent; font-size: 12px; }
    .showcase-form { display: grid; grid-template-columns: minmax(270px, 1fr) minmax(300px, 1.2fr) minmax(190px, 1fr) minmax(190px, 1fr); gap: 8px 12px; padding: 8px 12px 10px; background: #eef2f3; color: #172126; }
    .showcase-form label, .showcase-choice { color: #56666c; font-size: 12px; }
    .showcase-options { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .showcase-options button { min-height: 28px; border: 1px solid #b8c7cb; border-radius: 3px; color: #31444a; background: white; font-size: 12px; }
    .showcase-options button.selected { border-color: #086b7d; color: white; background: #086b7d; }
    .showcase-form textarea { min-height: 42px; resize: vertical; }
    .showcase-note-field { display: grid; gap: 4px; }
    .showcase-phrases { display: flex; flex-wrap: wrap; gap: 4px; }
    .showcase-phrases button { min-height: 25px; padding: 3px 7px; border: 1px solid #b8c7cb; border-radius: 3px; color: #42575d; background: #f8fbfc; font-size: 11px; }
    .showcase-phrases button.selected { border-color: #b66b22; color: #713d0c; background: #ffe4c7; }
    .showcase-status { grid-column: 1 / -1; min-height: 17px; color: #597078; font-size: 12px; }
    .empty { padding: 44px; color: #627278; text-align: center; }
    @media (max-width: 1000px) { .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } header { align-items: start; gap: 10px; } }
  </style>
</head>
<body>
  <header><h1>视频走查</h1><span id="summary">正在读取数据</span></header>
  <main>
    <form class="toolbar" id="filters">
      <label>视频名称<input name="keyword" type="search" placeholder="输入名称"></label>
      <label>一级地址<select name="level_1"><option value="">全部</option></select></label>
      <label>二级地址<select name="level_2"><option value="">全部</option></select></label>
      <label>批次<select name="batch"><option value="">全部</option></select></label>
      <label>日期从<input name="created_from" type="date"></label>
      <label>日期至<input name="created_to" type="date"></label>
      <label>评级<select name="rating"><option value="">全部</option><option>未评级</option><option>优秀</option><option>良好</option><option>合格</option><option>不合格</option><option>无需审核</option></select></label>
      <button type="button" id="export">导出 CSV</button>
    </form>
    <div class="table-wrap">
      <table><thead><tr><th>一级地址</th><th>二级地址</th><th>创建日期</th><th>视频名称</th><th>原视频链接</th><th>截图</th><th>文件信息</th><th>原片类型</th><th>评级</th><th>质检备注</th><th>补充</th></tr></thead><tbody id="rows"></tbody></table>
      <div class="empty" id="empty" hidden>没有符合条件的视频</div>
    </div>
    <div class="pager"><button id="prev" type="button">上一页</button><span id="page-label"></span><button id="next" type="button">下一页</button></div>
  </main>
  <dialog id="viewer">
    <button class="close" type="button" aria-label="关闭">×</button>
    <div class="showcase">
      <button class="showcase-nav" id="previous-shot" type="button" aria-label="上一张图片">‹</button>
      <img id="showcase-image" alt="截图原图">
      <button class="showcase-nav" id="next-shot" type="button" aria-label="下一张图片">›</button>
    </div>
    <div class="showcase-info"><span><span id="showcase-name"></span> <a id="showcase-video-link" target="_blank" rel="noopener noreferrer">打开原视频</a></span><span class="showcase-actions"><button id="previous-video" type="button">上一视频</button><span id="showcase-shot-label"></span><button id="next-video" type="button">下一视频</button></span></div>
    <div class="showcase-form">
      <div class="showcase-choice" id="showcase-original-type">原片类型<div class="showcase-options"><button type="button" data-value="新片">新片</button><button type="button" data-value="旧片新剪">旧片新剪</button><button type="button" data-value="人像原片">人像原片</button><button type="button" data-value="屏幕原片">屏幕原片</button></div></div>
      <div class="showcase-choice" id="showcase-rating">评级<div class="showcase-options"><button type="button" data-value="优秀">优秀</button><button type="button" data-value="良好">良好</button><button type="button" data-value="合格">合格</button><button type="button" data-value="不合格">不合格</button><button type="button" data-value="无需审核">无需审核</button></div></div>
      <label class="showcase-note-field">质检备注<textarea id="showcase-note"></textarea><span class="showcase-phrases" id="showcase-phrases"><button type="button">人像偏黄</button><button type="button">人像偏暗</button><button type="button">人像泛绿</button><button type="button">人像模糊</button><button type="button">人像和课件不统一</button><button type="button">头发边缘锯齿</button><button type="button">人像边缘有粗边</button></span></label>
      <label>补充<textarea id="showcase-supplement"></textarea></label>
      <span class="showcase-status" id="showcase-status"></span>
    </div>
  </dialog>
  <script>
    const state = { page: 1, pageSize: 50, total: 0 };
    const filters = document.querySelector("#filters");
    const rows = document.querySelector("#rows");
    const viewer = document.querySelector("#viewer");
    const showcaseImage = document.querySelector("#showcase-image");
    const showcaseName = document.querySelector("#showcase-name");
    const showcaseVideoLink = document.querySelector("#showcase-video-link");
    const showcaseShotLabel = document.querySelector("#showcase-shot-label");
    const showcaseOriginalType = document.querySelector("#showcase-original-type");
    const showcaseRating = document.querySelector("#showcase-rating");
    const showcaseNote = document.querySelector("#showcase-note");
    const showcasePhrases = document.querySelector("#showcase-phrases");
    const showcaseSupplement = document.querySelector("#showcase-supplement");
    const showcaseStatus = document.querySelector("#showcase-status");
    const showcase = { videos: [], videoIndex: 0, shotIndex: 0, saving: false, saveAgain: false };

    function query(includePage = true) {
      const params = new URLSearchParams(new FormData(filters));
      for (const [key, value] of [...params]) if (!value) params.delete(key);
      if (includePage) { params.set("page", state.page); params.set("page_size", state.pageSize); }
      return params;
    }

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function formatDuration(seconds) {
      const value = Math.round(seconds);
      return [Math.floor(value / 3600), Math.floor(value % 3600 / 60), value % 60].map(part => String(part).padStart(2, "0")).join(":");
    }

    function choiceValue(group) {
      return group.querySelector("button.selected")?.dataset.value || "";
    }

    function selectChoice(group, value) {
      for (const button of group.querySelectorAll("button")) button.classList.toggle("selected", button.dataset.value === value);
    }

    function updatePhraseChoices() {
      const note = showcaseNote.value;
      for (const button of showcasePhrases.querySelectorAll("button")) button.classList.toggle("selected", note.includes(button.textContent));
    }

    function updateShowcase() {
      const video = showcase.videos[showcase.videoIndex];
      if (!video) return;
      const snapshot = video.snapshots[showcase.shotIndex];
      showcaseImage.src = snapshot.url;
      showcaseImage.title = formatDuration(snapshot.second);
      showcaseName.textContent = video.file_name;
      showcaseVideoLink.href = video.video_url;
      showcaseShotLabel.textContent = `视频 ${showcase.videoIndex + 1} / ${showcase.videos.length} · 图片 ${showcase.shotIndex + 1} / ${video.snapshots.length} · ${formatDuration(snapshot.second)}`;
      selectChoice(showcaseOriginalType, video.review.original_type || "");
      selectChoice(showcaseRating, video.review.rating || "未评级");
      showcaseNote.value = video.review.review_note || "";
      updatePhraseChoices();
      showcaseSupplement.value = video.review.supplement || "";
      showcaseStatus.textContent = "";
    }

    function openShowcase(videos, videoIndex, shotIndex) {
      showcase.videos = videos;
      showcase.videoIndex = videoIndex;
      showcase.shotIndex = shotIndex;
      updateShowcase();
      viewer.showModal();
    }

    function moveShowcaseVideo(step) {
      if (!showcase.videos.length) return;
      showcase.videoIndex = (showcase.videoIndex + step + showcase.videos.length) % showcase.videos.length;
      showcase.shotIndex = 0;
      updateShowcase();
    }

    function moveShowcaseShot(step) {
      const video = showcase.videos[showcase.videoIndex];
      if (!video) return;
      showcase.shotIndex = (showcase.shotIndex + step + video.snapshots.length) % video.snapshots.length;
      updateShowcase();
    }

    async function saveShowcaseReview() {
      const video = showcase.videos[showcase.videoIndex];
      if (!video) return;
      if (showcase.saving) { showcase.saveAgain = true; return; }
      showcase.saving = true;
      showcaseStatus.textContent = "保存中";
      try {
        const response = await fetch(`/api/videos/${video.video_id}/review`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ original_type: choiceValue(showcaseOriginalType), rating: choiceValue(showcaseRating) || "未评级", review_note: showcaseNote.value, supplement: showcaseSupplement.value, version: video.review.version }) });
        const data = await response.json();
        if (response.ok) { video.review = data; showcaseStatus.textContent = "已保存"; } else { showcaseStatus.textContent = data.detail || "保存失败，请刷新后重试"; }
      } catch (error) { showcaseStatus.textContent = "保存失败，请检查网络"; }
      showcase.saving = false;
      if (showcase.saveAgain) { showcase.saveAgain = false; saveShowcaseReview(); }
    }

    function buildRow(video, videos, videoIndex) {
      const row = document.createElement("tr");
      row.append(element("td", video.level_1));
      row.append(element("td", video.level_2));
      row.append(element("td", video.created_date, "meta"));
      const name = element("td", undefined, "name");
      name.append(document.createTextNode(video.file_name), element("br"), element("small", `批次：${video.batch}`));
      row.append(name);
      const media = element("td");
      const videoLink = element("a", "打开原视频"); videoLink.href = video.video_url; videoLink.target = "_blank"; videoLink.rel = "noopener noreferrer";
      media.append(videoLink); row.append(media);
      const shotsCell = element("td"); const shots = element("div", undefined, "shots");
      for (const [shotIndex, snapshot] of video.snapshots.entries()) {
        const image = element("img"); image.src = snapshot.url; image.alt = `截图 ${snapshot.sequence}`; image.title = formatDuration(snapshot.second);
        image.addEventListener("click", () => openShowcase(videos, videoIndex, shotIndex)); shots.append(image);
      }
      shotsCell.append(shots); row.append(shotsCell);
      row.append(element("td", `${(video.file_size / 1048576).toFixed(1)} MB\n${formatDuration(video.duration)}\n${video.width} × ${video.height}`, "meta"));
      const originalTypeCell = element("td", undefined, "review"); const originalType = element("select");
      for (const value of ["", "新片", "旧片新剪", "人像原片", "屏幕原片"]) { const option = element("option", value || "（空）"); option.value = value; originalType.append(option); }
      originalType.value = video.review.original_type || ""; originalTypeCell.append(originalType); row.append(originalTypeCell);
      const ratingCell = element("td", undefined, "review"); const rating = element("select");
      for (const value of ["未评级", "优秀", "良好", "合格", "不合格", "无需审核"]) { const option = element("option", value); option.value = value; rating.append(option); }
      const ratingClasses = { "未评级": "rating-unrated", "优秀": "rating-excellent", "良好": "rating-good", "合格": "rating-pass", "不合格": "rating-fail", "无需审核": "rating-good" };
      function updateRatingColor() { rating.className = ratingClasses[rating.value] || "rating-unrated"; }
      rating.value = video.review.rating; updateRatingColor(); rating.addEventListener("change", updateRatingColor); ratingCell.append(rating); row.append(ratingCell);
      const noteCell = element("td"); const note = element("textarea"); note.value = video.review.review_note; noteCell.append(note); row.append(noteCell);
      const supplementCell = element("td"); const supplement = element("textarea"); supplement.value = video.review.supplement;
      const status = element("span", "", "status");
      let saving = false; let saveAgain = false;
      async function saveReview() {
        if (saving) { saveAgain = true; return; }
        saving = true; status.textContent = "保存中";
        try {
          const response = await fetch(`/api/videos/${video.video_id}/review`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ original_type: originalType.value, rating: rating.value, review_note: note.value, supplement: supplement.value, version: video.review.version }) });
          const data = await response.json();
          if (response.ok) { video.review = data; status.textContent = "已保存"; } else { status.textContent = data.detail || "保存失败，请刷新后重试"; }
        } catch (error) { status.textContent = "保存失败，请检查网络"; }
        saving = false;
        if (saveAgain) { saveAgain = false; saveReview(); }
      }
      originalType.addEventListener("change", saveReview); rating.addEventListener("change", saveReview); note.addEventListener("blur", saveReview); supplement.addEventListener("blur", saveReview);
      noteCell.append(note, status); row.append(noteCell);
      supplementCell.append(supplement); row.append(supplementCell);
      return row;
    }

    async function load() {
      const response = await fetch(`/api/videos?${query()}`); const data = await response.json();
      state.total = data.total; showcase.videos = data.items; rows.replaceChildren(...data.items.map((video, index) => buildRow(video, data.items, index)));
      document.querySelector("#empty").hidden = data.items.length > 0;
      const pages = Math.max(1, Math.ceil(state.total / state.pageSize));
      document.querySelector("#summary").textContent = `共 ${state.total} 条记录`;
      document.querySelector("#page-label").textContent = `第 ${state.page} / ${pages} 页`;
      document.querySelector("#prev").disabled = state.page <= 1;
      document.querySelector("#next").disabled = state.page >= pages;
    }

    async function loadOptions() {
      const options = await (await fetch("/api/videos/options")).json();
      for (const field of ["level_1", "level_2", "batch"]) {
        const select = filters.elements[field];
        for (const value of options[field]) { const option = element("option", value || "（空）"); option.value = value; select.append(option); }
      }
    }

    filters.addEventListener("submit", event => event.preventDefault());
    filters.addEventListener("change", () => { state.page = 1; load(); });
    filters.elements.keyword.addEventListener("input", () => { clearTimeout(state.timer); state.timer = setTimeout(() => { state.page = 1; load(); }, 250); });
    document.querySelector("#prev").addEventListener("click", () => { state.page -= 1; load(); });
    document.querySelector("#next").addEventListener("click", () => { state.page += 1; load(); });
    document.querySelector("#export").addEventListener("click", () => { location.href = `/api/videos/export.csv?${query(false)}`; });
    document.querySelector("#previous-video").addEventListener("click", () => moveShowcaseVideo(-1));
    document.querySelector("#next-video").addEventListener("click", () => moveShowcaseVideo(1));
    document.querySelector("#previous-shot").addEventListener("click", () => moveShowcaseShot(-1));
    document.querySelector("#next-shot").addEventListener("click", () => moveShowcaseShot(1));
    for (const group of [showcaseOriginalType, showcaseRating]) group.addEventListener("click", event => {
      const button = event.target.closest("button[data-value]");
      if (!button) return;
      selectChoice(group, button.dataset.value);
      saveShowcaseReview();
    });
    showcasePhrases.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button || showcaseNote.value.includes(button.textContent)) return;
      const separator = showcaseNote.value.trim() ? "；" : "";
      showcaseNote.value = `${showcaseNote.value.trim()}${separator}${button.textContent}`;
      updatePhraseChoices();
      saveShowcaseReview();
    });
    showcaseNote.addEventListener("input", updatePhraseChoices);
    document.querySelector("#showcase-note").addEventListener("blur", saveShowcaseReview);
    document.querySelector("#showcase-supplement").addEventListener("blur", saveShowcaseReview);
    viewer.querySelector(".close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", event => { if (event.target === viewer) viewer.close(); });
    viewer.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") moveShowcaseVideo(-1);
      if (event.key === "ArrowRight") moveShowcaseVideo(1);
      if (event.key === "ArrowUp") moveShowcaseShot(-1);
      if (event.key === "ArrowDown") moveShowcaseShot(1);
    });
    loadOptions().then(load);
  </script>
</body>
</html>
